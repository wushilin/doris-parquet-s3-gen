# Template S3 target. Copy this to s3.local.toml and edit:
#
#   cp s3.toml s3.local.toml
#
# Anything matching *.local.* is gitignored, so your real bucket and any
# credentials stay out of the repository. run.sh reads s3.local.toml.
#
# Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the
# environment, so no [s3.credentials] section is needed here.

[s3]
bucket = "my-bucket"
prefix = "datagen/my_table/"
region = "ap-southeast-1"

[upload]
# Each part is buffered in memory before it is sent. S3 allows at most
# 10000 parts per object, so 10MiB parts cap a single file at about 97GiB.
part_size = "10MiB"

# Parts in flight per file. Peak upload buffer per writer thread is
# part_size x max_concurrent_parts = 80MiB.
max_concurrent_parts = 8

retries = 3
timeout = "60s"

[parquet]
compression = "zstd"
compression_level = 3
row_group_rows = 200000
dictionary = true
