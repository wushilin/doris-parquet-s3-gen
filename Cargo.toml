[package]
name = "doris-parquet-s3-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
arrow = "59.3.0"
async-channel = "2.5.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
futures = "0.3.34"
handlebars = "6"
object_store = { version = "0.14.1", features = ["aws"] }
parquet = { version = "59.3.0", features = ["async"] }
precise_rate_limiter = "0.3.0"
rand = "0.8"
rquickjs = "0.6"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
